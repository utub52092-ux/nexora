<style>

.g{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}

.btn{border:1px solid var(--ln);background:var(--card);padding:10px 16px;border-radius:12px;cursor:pointer;transition:.2s;display:inline-flex;gap:8px;align-items:center}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:10px 12px;border-bottom:1px solid var(--ln);cursor:pointer;white-space:nowrap;user-select:none}

tbody tr{transition:.15s}tbody tr:hover{background:var(--card)}
.u{display:flex;align-items:center;gap:12px}

.pj{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.pj .cd{display:flex;flex-direction:column;gap:10px}.pj p{margin:0;color:var(--mut);flex:1}
.nt{display:flex;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--ln);margin-bottom:10px;align-items:flex-start;transition:.2s}
.nt.un{background:rgba(124,108,255,.08);border-color:rgba(124,108,255,.35)}
.nt .kic{flex:none}
.fm{display:grid;gap:14px;max-width:560px}.fm label{display:grid;gap:6px;color:var(--mut);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln)}
.sw{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--ln);position:relative;cursor:pointer;transition:.25s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw:checked{background:var(--ac)}.sw:checked::after{left:21px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60;padding:20px;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.md>div{background:var(--bg2);border:1px solid var(--ln);border-radius:22px;padding:26px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.md h2{margin:0 0 16px;font-size:20px}
.ts{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--ac);padding:12px 20px;border-radius:14px;z-index:80;animation:up .3s}
.sk{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--card),var(--ln),var(--card));background-size:200% 100%;animation:sh 1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:36px;text-align:center;color:var(--mut)}
.ov{display:none}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}}
@media(max-width:900px){.sb{transform:translateX(-100%);width:250px!important}body.no .sb{transform:none}body.no .ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:25}.main,body.col .main{margin-left:0}.mb{display:grid}body.col .nv span,body.col .lg b{display:inline}.top{padding:12px 16px}.pg{padding:16px}.demo{display:none}}
@media(max-width:560px){.g4{grid-template-columns:1fr}.kv{font-size:26px}.top h1{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
